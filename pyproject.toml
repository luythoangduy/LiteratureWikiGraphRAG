[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-wiki-graphrag"
version = "0.1.0"
description = "A concept-centric Wiki-style GraphRAG workspace for literature reviews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.0",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "networkx>=3.3",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "rapidfuzz>=3.9.0",
  "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]
pdf = [
  "pypdf>=4.2.0",
]
export = [
  "openpyxl>=3.1.0",
]

[project.scripts]
lwgrag-check = "literature_wiki_graphrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
